repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3.13
        exclude: ^vision_worker/omniparser/util/

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        exclude: ^vision_worker/omniparser/util/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: venv/bin/mypy
        language: system
        types: [python]
        args: ["--config-file", "setup.cfg"]
        exclude: migrations/|controller_client/|vision_worker/

      - id: mypy-controller-client
        name: mypy (controller_client)
        entry: controller_client/.venv/bin/mypy --config-file controller_client/setup.cfg
        language: system
        types: [python]
        files: ^controller_client/

      # Same check for the Windows-only branches (sys.platform == "win32"),
      # which the host pass treats as unreachable. Own cache so the two passes
      # do not invalidate each other.
      - id: mypy-controller-client-win32
        name: mypy (controller_client, win32)
        entry: controller_client/.venv/bin/mypy --config-file controller_client/setup.cfg --platform win32 --cache-dir .mypy_cache/controller_client_win32
        language: system
        types: [python]
        files: ^controller_client/

      - id: mypy-vision-worker
        name: mypy (vision_worker)
        entry: vision_worker/.venv/bin/mypy --config-file vision_worker/setup.cfg
        language: system
        types: [python]
        files: ^vision_worker/
        exclude: ^vision_worker/omniparser/(util|weights)/
