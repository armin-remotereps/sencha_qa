repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3.13
        exclude: controller_client/omniparser/util/

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        exclude: controller_client/omniparser/util/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: venv/bin/mypy
        language: system
        types: [python]
        args: ["--config-file", "setup.cfg"]
        exclude: migrations/|controller_client/

      - id: mypy-controller-client
        name: mypy (controller_client)
        entry: controller_client/.venv/bin/mypy --config-file controller_client/setup.cfg
        language: system
        types: [python]
        files: ^controller_client/
        exclude: ^controller_client/omniparser/(util|weights)/
