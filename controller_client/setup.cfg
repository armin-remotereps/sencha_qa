[mypy]
python_version = 3.13
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
# omniparser/util: vendored third-party OmniParser code (untyped upstream).
# omniparser/weights: downloaded model weights, including a bundled handler.py
# from the HuggingFace model repo itself — not source code we maintain.
exclude = omniparser/(util|weights)|stubs/
# Narrow local stubs for untyped third-party packages (pyobjc's Quartz and
# AppKit); they cover only what the controller uses.
mypy_path = $MYPY_CONFIG_FILE_DIR/stubs
# Name modules from the mypy_path / cwd roots so a stub passed explicitly (as
# pre-commit does) is "Quartz", not "controller_client.stubs.Quartz".
explicit_package_bases = True

[mypy-decouple.*]
ignore_missing_imports = True

[isort]
profile = black
