server {
    listen 80;
    listen [::]:80;

    server_name sench.remotereps.com;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name sench.remotereps.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/sench.remotereps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sench.remotereps.com/privkey.pem;

    location /flower/ {
        proxy_pass                          http://flower:5555;
        client_max_body_size                200M;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location / {
        proxy_pass                          http://api:8000;
        client_max_body_size                200M;
        proxy_read_timeout                  120;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # MCP gateway (uvicorn, service mcp). Responses may stream (SSE), so no
    # buffering. The default access log format has no request headers, so
    # the Authorization bearer key is never logged; keep it that way.
    location /mcp {
        proxy_pass                          http://mcp:8001;
        proxy_http_version                  1.1;
        proxy_buffering                     off;
        proxy_read_timeout                  120;
        client_max_body_size                11m;
        proxy_set_header Connection         "";
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        # Overwritten, never appended: uvicorn takes the client IP from this
        # header and the key check counts failures per IP, so a client must
        # not be able to inject its own leftmost entry.
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /ws/ {
        proxy_pass                          http://api:8000;
        proxy_http_version                  1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout                  86400;
    }

    location /static/ {
        autoindex on;
        alias /src/staticfiles/;
        client_max_body_size 200M;
    }

    location /media/ {
        autoindex on;
        alias /src/media/;
        client_max_body_size 200M;
    }
}