[mypy]
plugins = mypy_django_plugin.main
strict = True
mypy_path = stubs
# controller_client is a standalone codebase with its own venv, its own
# requirements (including torch, absent from this project's venv), and its
# own strict mypy config (controller_client/setup.cfg) — verify it via
# `controller_client/.venv/bin/mypy --config-file controller_client/setup.cfg`,
# not this one.
exclude = venv|migrations|controller_client

[mypy.plugins.django-stubs]
django_settings_module = auto_tester.settings

[mypy-django_celery_beat.*]
ignore_missing_imports = True

[mypy-django_celery_results.*]
ignore_missing_imports = True

[mypy-docker.*]
ignore_missing_imports = True

[mypy-paramiko.*]
ignore_missing_imports = True

[mypy-decouple.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[isort]
profile = black
