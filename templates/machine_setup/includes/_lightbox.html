{% comment %}
  Screenshot lightbox for one tool row's screenshots (the case-page pattern).
  Reads showLightbox, lightboxShots, lightboxIndex, navigatePrev and
  navigateNext from the ancestor machineSetupChat scope.
{% endcomment %}
<div
  class="dialog-backdrop"
  x-show="showLightbox"
  x-cloak
  x-on:keydown.escape.window="showLightbox = false"
  x-on:keydown.left.window="navigatePrev()"
  x-on:keydown.right.window="navigateNext()"
  x-trap.noscroll="showLightbox"
  @click.self="showLightbox = false"
>
  <div class="dialog dialog-lg" role="dialog" aria-labelledby="setup-lightbox-h" aria-modal="true">
    <div class="card-header">
      <h3 id="setup-lightbox-h" x-text="lightboxShots[lightboxIndex] ? lightboxShots[lightboxIndex].tool_name : ''"></h3>
      <button class="icon-btn" type="button" aria-label="Close" @click="showLightbox = false">✕</button>
    </div>
    <img class="lightbox-img" :src="lightboxShots[lightboxIndex] ? lightboxShots[lightboxIndex].url : ''" alt="">
    <div class="dialog-actions dialog-actions-spread">
      <button class="btn btn-ghost" type="button" :aria-disabled="(lightboxIndex === 0).toString()" @click="navigatePrev()">&larr; Previous</button>
      <span class="muted small" x-text="(lightboxIndex + 1) + ' / ' + lightboxShots.length"></span>
      <button class="btn btn-ghost" type="button" :aria-disabled="(lightboxIndex >= lightboxShots.length - 1).toString()" @click="navigateNext()">Next &rarr;</button>
    </div>
  </div>
</div>
