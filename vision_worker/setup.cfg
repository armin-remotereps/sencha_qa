[mypy]
python_version = 3.13
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
# omniparser/util: vendored third-party OmniParser code (untyped upstream).
# omniparser/weights: downloaded model weights, including a bundled handler.py
# from the HuggingFace model repo itself — not source code we maintain.
exclude = omniparser/(util|weights)/
# Name modules from the cwd root so `mypy vision_worker/` and pre-commit's
# explicit file list resolve them the same way.
explicit_package_bases = True

[mypy-decouple.*]
ignore_missing_imports = True

[isort]
profile = black
